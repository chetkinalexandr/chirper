[project]
name = "voice-notes"
version = "1.3.1"
description = "Локальная диктовка на русском для macOS"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
# Системный Python — 3.10. Синтаксис 3.11+ линтер должен ловить, а не пропускать.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
