name: Quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test tools
        run: python -m pip install numpy==2.2.6 pytest==9.1.1 ruff==0.16.1
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Validate shell scripts
        run: bash -n собрать_app.sh
      - name: Validate app resources
        run: |
          plutil -lint native/Info.plist
          file native/VoiceNotes.icns | grep -q "Mac OS X icon"
      - name: Build native launcher
        run: >-
          xcrun swiftc -swift-version 5
          -target arm64-apple-macos13.0
          -framework AppKit -framework ApplicationServices -framework AVFoundation
          -framework CoreAudio
          native/VoiceNotes.swift -o /tmp/VoiceNotes
